<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Pricing Snapshots</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header>
    <h1>LLM Pricing Snapshots</h1>
    <p class="tagline">Up-to-date price data for major LLM providers.</p>
  </header>
  <main>
    <section class="filters">
      <label for="provider-filter">Provider</label>
      <select id="provider-filter"></select>
      <label for="search-filter">Search models</label>
      <input id="search-filter" type="search" placeholder="Search model names..." />
    </section>
    <section>
      <table id="prices-table">
        <thead>
          <tr>
            <th>Provider</th>
            <th>Model</th>
            <th>Usage</th>
            <th>Unit</th>
            <th>Price</th>
            <th>Currency</th>
            <th>Source</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <footer>
    <p>Data generated by <code>scripts/update_prices.py</code>. Historical snapshots live in <code>data/history</code>.</p>
  </footer>
  <script src="assets/app.js"></script>
</body>
</html>
